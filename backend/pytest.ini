[pytest]
# Suite backend : `pytest` (parallèle, base réutilisée) ; boucle de dev : `pytest --testmon` (tests impactés seulement).
# Base de test neuve après un changement de modèles : `pytest --create-db`.
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py tests_*.py
addopts = -n auto --reuse-db -p no:cacheprovider -q
norecursedirs = .venv node_modules migrations .git __pycache__
filterwarnings =
    ignore::DeprecationWarning
