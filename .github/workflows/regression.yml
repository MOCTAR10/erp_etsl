# régression ETSL — GitHub Actions (gratuit : dépôt public)
#
# Jobs indépendants (parallèles), déclenchés à chaque push sur master, chaque nuit
# à 23h UTC (= 00h à Libreville, UTC+1) et via le bouton manuel :
#   quality  → ruff (erreurs réelles), manage.py check, migrations à jour, cohérence RBAC (~1 min)
#   backend  → suite Django (22 apps, ~420 tests) découpée en 5 shards parallèles
#              (matrix) + couverture par shard (report-only) : ~10 min au lieu de ~40
#   frontend → typecheck + build + vitest
#   e2e      → Playwright (chromium et firefox en parallèle) contre une base dédiée seedée
#   (aussi déclenché sur pull request vers master)
#
# Infra = containers éphémères par job (Postgres / MinIO / Redis) : base neuve à
# chaque run, aucune mutation possible de la base de dev. Rien à surveiller : le
# run est vert/rouge sur GitHub, les logs du step fautif sont un clic.

name: regression

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # régression quotidienne automatique (minuit heure du Gabon = 23h UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

# Valeurs de dev/démo uniquement (aucun secret ; voir backend/.env.example)
env:
  DJANGO_SECRET_KEY: ci-only-not-a-secret-key-0123456789abcdef
  # Les e2e se connectent des dizaines de fois depuis la meme IP : pas de throttle en CI.
  THROTTLE_ANON: 100000/min
  THROTTLE_USER: 100000/min
  THROTTLE_LOGIN: 100000/min
  DEBUG: "False"
  ALLOWED_HOSTS: localhost,127.0.0.1
  POSTGRES_USER: etls
  POSTGRES_PASSWORD: etls_dev_password
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  MINIO_ROOT_USER: etls_minio
  MINIO_ROOT_PASSWORD: etls_minio_dev_password
  MINIO_ENDPOINT: http://localhost:9000
  CELERY_TASK_ALWAYS_EAGER: "True"

jobs:
  quality:
    name: Qualité (lint, check, migrations, RBAC)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: pip install -r backend/requirements-dev.lock
      - name: Lint (ruff - erreurs reelles uniquement)
        working-directory: backend
        run: ruff check . --select E9,F63,F7,F82,F811 --exclude migrations
      - name: manage.py check + migrations a jour
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Coherence RBAC (lecture >= ecriture / montants)
        working-directory: backend
        run: python check_rbac_coherence.py

  backend:
    name: Backend ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Répartition équilibrée par temps : `documents` (uploads MinIO) est le plus lent.
          - shard: socle-ged
            apps: "users documents workflow reports referentiels registres"
          - shard: noyau-bi
            apps: "accounting_kernel integrations outbox analytics"
          - shard: m1-m4
            apps: "commercial achats operations logistique"
          - shard: m5-m8
            apps: "stocks qualite hse maintenance"
          - shard: m9-m12
            apps: "rh_paie comptabilite controle_gestion juridique"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: etls_ci
          POSTGRES_USER: etls
          POSTGRES_PASSWORD: etls_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etls -d etls_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Start S3 (SeaweedFS — remplace MinIO, archivé en 2026-09 ; même port 9000, mêmes identifiants de dev)
        run: |
          docker run -d --name s3 -p 9000:8333 \
            -v "$GITHUB_WORKSPACE/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/ || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          echo "s3 ok (HTTP $code)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install backend
        run: pip install -r backend/requirements-dev.lock
      - name: Create MinIO bucket (etls-documents)
        run: |
          python - <<'EOF'
          import time
          import boto3
          client = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              aws_access_key_id="etls_minio",
              aws_secret_access_key="etls_minio_dev_password",
              region_name="us-east-1",
          )
          for attempt in range(10):
              try:
                  client.create_bucket(Bucket="etls-documents")
                  print("bucket etls-documents ok")
                  break
              except Exception as exc:
                  print(f"tentative {attempt + 1}: {exc}")
                  time.sleep(2)
          EOF
      - name: Backend tests ${{ matrix.shard }} (pytest parallèle, coverage report-only, pas de gate)
        working-directory: backend
        env:
          POSTGRES_DB: etls_ci
          # Le vrai MinIO n'est testé qu'une fois (aller-retour S3) ; les autres tests utilisent le stockage mémoire.
          MINIO_INTEGRATION: ${{ matrix.shard == 'socle-ged' && '1' || '0' }}
        run: |
          set -o pipefail  # sinon `| tee` masquerait un échec de pytest
          python -m pytest -n auto --cov=. --cov-report=xml:coverage.xml --cov-report=term ${{ matrix.apps }} | tee pytest.log
          echo "### Backend — ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 pytest.log >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-${{ matrix.shard }}
          path: backend/coverage.xml
          retention-days: 14

  frontend:
    name: Frontend (typecheck, build, vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit

  e2e:
    name: E2E Playwright ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Chromium à chaque push / PR ; Firefox en plus dans la régression nocturne et au lancement manuel.
        browser: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["chromium","firefox"]' || '["chromium"]') }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: etls_e2e
          POSTGRES_USER: etls
          POSTGRES_PASSWORD: etls_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etls -d etls_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Start S3 (SeaweedFS — remplace MinIO, archivé en 2026-09 ; même port 9000, mêmes identifiants de dev)
        run: |
          docker run -d --name s3 -p 9000:8333 \
            -v "$GITHUB_WORKSPACE/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/ || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          echo "s3 ok (HTTP $code)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: pip install -r backend/requirements.lock
      - name: Create MinIO bucket (etls-documents)
        run: |
          python - <<'EOF'
          import time
          import boto3
          client = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              aws_access_key_id="etls_minio",
              aws_secret_access_key="etls_minio_dev_password",
              region_name="us-east-1",
          )
          for attempt in range(10):
              try:
                  client.create_bucket(Bucket="etls-documents")
                  print("bucket etls-documents ok")
                  break
              except Exception as exc:
                  print(f"tentative {attempt + 1}: {exc}")
                  time.sleep(2)
          EOF
      - name: Migrate + seed (base dediee etls_e2e)
        working-directory: backend
        env:
          POSTGRES_DB: etls_e2e
        run: |
          python manage.py migrate
          python manage.py seed_all_demo
      - name: Start Django backend (127.0.0.1:8000, gunicorn 4 workers)
        working-directory: backend
        env:
          POSTGRES_DB: etls_e2e
          # Les scénarios e2e n'ont qu'un compte administrateur (demandeur) : circuit de permis à un niveau.
          # Le circuit complet superviseur → HSE → DG (CDC M7 §9.4) est couvert par hse/test_permis_multiniveaux.py.
          HSE_PERMIS_NIVEAUX: hse
          # MFA des rôles sensibles (lot 15b) couverte par users/test_securite_acces.py ; l'e2e se connecte en admin.
          MFA_ROLES: ""
        run: |
          gunicorn config.wsgi:application -b 127.0.0.1:8000 -w 4 --timeout 120 > /tmp/runserver.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/health/ || { cat /tmp/runserver.log; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: E2E Playwright
        working-directory: frontend
        env:
          # Tests indépendants (fullyParallel) répartis sur 4 navigateurs ; build de production servi par vite preview
          # (pas de compilation à la demande, vrai service worker PWA testé). Mesuré : 8,2 min → 2,4 min (Chromium).
          PW_WORKERS: "4"
          PW_WEB_CMD: "npx vite build --logLevel error && npx vite preview --host 127.0.0.1 --port 5173 --strictPort"
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
          npx playwright test --project=${{ matrix.browser }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 14