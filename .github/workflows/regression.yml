# régression ETSL — GitHub Actions (gratuit : dépôt public)
#
# 3 jobs indépendants, déclenchés à chaque push sur master, chaque nuit à 23h UTC
# (= 00h à Libreville, UTC+1) et via le bouton manuel :
#   backend  → suite Django (22 apps, ~400 tests) + rapport de couverture (report-only)
#   frontend → typecheck + build + vitest
#   e2e      → Playwright chromium/firefox contre une base dédiée seedée (etls_e2e)
#
# Infra = containers éphémères par job (Postgres / MinIO / Redis) : base neuve à
# chaque run, aucune mutation possible de la base de dev. Rien à surveiller : le
# run est vert/rouge sur GitHub, les logs du step fautif sont un clic.

name: regression

on:
  push:
    branches: [master]
  schedule:
    # régression quotidienne automatique (minuit heure du Gabon = 23h UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

# Valeurs de dev/démo uniquement (aucun secret ; voir backend/.env.example)
env:
  DJANGO_SECRET_KEY: ci-only-dev-key
  DEBUG: "False"
  ALLOWED_HOSTS: localhost,127.0.0.1
  POSTGRES_USER: etls
  POSTGRES_PASSWORD: etls_dev_password
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  MINIO_ROOT_USER: etls_minio
  MINIO_ROOT_PASSWORD: etls_minio_dev_password
  MINIO_ENDPOINT: http://localhost:9000
  CELERY_TASK_ALWAYS_EAGER: "True"

jobs:
  backend:
    name: Backend (tests + couverture)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: etls_ci
          POSTGRES_USER: etls
          POSTGRES_PASSWORD: etls_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etls -d etls_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO (bitnamilegacy — pull anonyme Docker Hub OK ; minio/minio archivé → exige auth ; Quay 401)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=etls_minio \
            -e MINIO_ROOT_PASSWORD=etls_minio_dev_password \
            bitnamilegacy/minio:latest
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live >/dev/null && echo "minio ok"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Create MinIO bucket (etls-documents)
        run: |
          python - <<'EOF'
          import time
          import boto3
          client = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              aws_access_key_id="etls_minio",
              aws_secret_access_key="etls_minio_dev_password",
              region_name="us-east-1",
          )
          for attempt in range(10):
              try:
                  client.create_bucket(Bucket="etls-documents")
                  print("bucket etls-documents ok")
                  break
              except Exception as exc:
                  print(f"tentative {attempt + 1}: {exc}")
                  time.sleep(2)
          EOF
      - name: Backend tests (coverage report-only, pas de gate)
        working-directory: backend
        env:
          POSTGRES_DB: etls_ci
        run: |
          coverage run --source='.' manage.py test users documents workflow reports referentiels registres accounting_kernel integrations outbox commercial achats operations logistique stocks qualite hse maintenance rh_paie comptabilite controle_gestion juridique analytics --noinput
          coverage xml -o coverage.xml
          echo "### Couverture backend" >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml
          retention-days: 14

  frontend:
    name: Frontend (typecheck, build, vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit

  e2e:
    name: E2E Playwright (chromium + firefox)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: etls_e2e
          POSTGRES_USER: etls
          POSTGRES_PASSWORD: etls_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etls -d etls_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO (bitnamilegacy — pull anonyme Docker Hub OK ; minio/minio archivé → exige auth ; Quay 401)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=etls_minio \
            -e MINIO_ROOT_PASSWORD=etls_minio_dev_password \
            bitnamilegacy/minio:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live >/dev/null && echo "minio ok"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Create MinIO bucket (etls-documents)
        run: |
          python - <<'EOF'
          import time
          import boto3
          client = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              aws_access_key_id="etls_minio",
              aws_secret_access_key="etls_minio_dev_password",
              region_name="us-east-1",
          )
          for attempt in range(10):
              try:
                  client.create_bucket(Bucket="etls-documents")
                  print("bucket etls-documents ok")
                  break
              except Exception as exc:
                  print(f"tentative {attempt + 1}: {exc}")
                  time.sleep(2)
          EOF
      - name: Migrate + seed (base dediee etls_e2e)
        working-directory: backend
        env:
          POSTGRES_DB: etls_e2e
        run: |
          python manage.py migrate
          python manage.py seed_all_demo
      - name: Start Django backend (127.0.0.1:8000)
        working-directory: backend
        env:
          POSTGRES_DB: etls_e2e
        run: |
          python manage.py runserver 127.0.0.1:8000 > /tmp/runserver.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/health/ || { cat /tmp/runserver.log; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: E2E Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps
          npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 14