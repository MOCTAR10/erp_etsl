name: etls_dbt
version: "1.0"
config-version: 2

profile: etls_prod

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
log-path: "logs"

clean-targets:
  - target
  - dbt_packages
  - logs

models:
  etls_dbt:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table