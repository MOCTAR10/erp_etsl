version: 2

models:
  - name: dm_documents
    description: "Fiche document enrichie pour le BI (type, projet, montant, rétention, poids)."
    columns:
      - name: id
        tests:
          - not_null
  - name: dm_workflow
    description: "Tâches de workflow enrichies (circuit, étape, acteur, délais de traitement)."
    columns:
      - name: id
        tests:
          - not_null
  - name: dm_retention
    description: "KPIs de rétention sur 0/30/60/90 jours (alertes J-90/J-60/J-30)."
    tests:
      - not_null:
          column_name: as_of_date
  - name: dm_retention_alerts
    description: "Liste des documents par fenêtre d'alerte de rétention (J30/J60/J90/EXPIRED)."
    columns:
      - name: id
        tests:
          - not_null
      - name: alert_window
        tests:
          - not_null
  - name: dm_direction_kpis
    description: "KPIs consolidés de la Direction (Couche D, C1) — un enregistrement par date."
    tests:
      - not_null:
          column_name: as_of_date
  - name: dm_reporting_petrolier
    description: "Reporting client pétrolier (Couche D, C2) — ASMR / HSE / Qualité."
    tests:
      - not_null:
          column_name: as_of_date
  - name: dm_alertes_echances
    description: "Échéancier transverse des alertes (Couche D, C3) — juridique, RH, GED ; fenêtres J90/J60/J30/EXPIRED."
    tests:
      - not_null:
          column_name: ref_code
      - not_null:
          column_name: alert_window
  - name: dm_maintenance_fiabilite
    description: "Fiabilité du parc (M8) : MTBF, MTTR et disponibilité par machine ; période d'observation paramétrable, valeurs provisoires signalées."
    columns:
      - name: actif_id
        tests:
          - not_null
  - name: dm_pointages_m9
    description: "Pointages M9 (Couche D) : heures productives, heures sup. par semaine ISO, nuit et astreinte par employé et par mois ; même règle que rh_paie.services.heures_supplementaires."
    columns:
      - name: employe_id
        tests:
          - not_null
      - name: periode
        tests:
          - not_null
  - name: dm_couts_m10
    description: "Coûts et produits M10 (Couche D) par mois et compte analytique ; même règle que controle_gestion.services.compute_marges (coût GR 618 isolé)."
    columns:
      - name: periode
        tests:
          - not_null
  - name: dm_compteurs_parc
    description: "Compteurs du parc (M8, Couche D) : une ligne par plan préventif en vigueur, échéance compteur ou calendaire (règle PlanPreventif.motif_echeance)."
    columns:
      - name: plan_id
        tests:
          - not_null
          - unique
  - name: dm_lectures_gr
    description: "Relevés de compteur des prestations GLOBAL RENTAL (Couche D) : première, dernière lecture et consommation par prestation."
    columns:
      - name: location_id
        tests:
          - not_null
          - unique
