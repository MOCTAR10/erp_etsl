services:
  postgres:
    image: postgres:16
    container_name: etls_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etls}
      POSTGRES_USER: ${POSTGRES_USER:-etls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etls_dev_password}
    ports:
      # Host port 5433 par défaut : le port 5432 est occupé par un PostgreSQL
      # Windows natif (postgresql-x64-17) sur la machine de dev.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etls} -d ${POSTGRES_DB:-etls}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stockage objet S3 de la GED : SeaweedFS (Apache-2.0, maintenu) remplace MinIO, archivé en 2026-09.
  # Publié sur le port 9000 (celui de MinIO) : MINIO_ENDPOINT=http://localhost:9000 reste valable partout.
  # Identifiants de DEV dans infra/seaweedfs/s3.json (production : fichier monté depuis les secrets).
  s3:
    image: chrislusf/seaweedfs:4.48
    container_name: etls_s3
    restart: unless-stopped
    command: >-
      server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024 -volume.max=16
    ports:
      - "${MINIO_API_PORT:-9000}:8333"
    volumes:
      - s3_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: etls_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  s3_data:
  redis_data:
