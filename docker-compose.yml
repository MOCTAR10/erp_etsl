services:
  postgres:
    image: postgres:16
    container_name: etls_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etls}
      POSTGRES_USER: ${POSTGRES_USER:-etls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etls_dev_password}
    ports:
      # Host port 5433 par défaut : le port 5432 est occupé par un PostgreSQL
      # Windows natif (postgresql-x64-17) sur la machine de dev.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etls} -d ${POSTGRES_DB:-etls}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: etls_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-etls_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-etls_minio_dev_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
