# Topologie de production — ERP ETSL
#
# PostgreSQL et MinIO ne sont PAS définis ici : ils tournent sur une
# infrastructure on-prem dédiée (résidence des données Gabon, RF-102), avec
# réplication streaming et sauvegardes pgBackRest. Voir ARCHITECTURE_ERP_ETSL.md §7.5.
#
# Compose ne gère que les services *stateless* : Django (web), Celery
# (worker/beat), Redis, Superset (BI) et le reverse proxy.
#
# Usage :
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Variables requises (shell ou .env) : DJANGO_SECRET_KEY, POSTGRES_PASSWORD,
# POSTGRES_HOST (serveur d�di�), POSTGRES_REPLICA_HOST (lecture BI/dbt),
# MINIO_ROOT_PASSWORD, MINIO_ENDPOINT, SUPERSET_SECRET_KEY, SUPERSET_DB_PASSWORD.

x-backend: &backend
  build:
    context: ./backend
  restart: unless-stopped
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
    DEBUG: "False"
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    POSTGRES_DB: ${POSTGRES_DB:-etls}
    POSTGRES_USER: ${POSTGRES_USER:-etls}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    POSTGRES_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-etls_minio}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    MINIO_ENDPOINT: ${MINIO_ENDPOINT:?set MINIO_ENDPOINT}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
  depends_on:
    redis:
      condition: service_healthy

services:
  web:
    <<: *backend
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"]
    expose:
      - "8000"

  celery-worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info"]

  celery-beat:
    <<: *backend
    command: ["sh", "-c", "python manage.py setup_beat_schedule && celery -A config beat -l info"]

  redis:
    image: redis:7-alpine
    container_name: etls_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # BI — Couche D (datamarts, reporting pétrolier, alertes J-90/J-60/J-30).
  # Lire le réplica PostgreSQL (jamais le primaire).
  # Init unique :
  #   docker compose -f docker-compose.prod.yml exec superset superset db upgrade
  #   docker compose -f docker-compose.prod.yml exec superset superset fab create-admin
  #   docker compose -f docker-compose.prod.yml exec superset superset init
  superset:
    image: apache/superset:4.1.1
    container_name: etls_superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set SUPERSET_SECRET_KEY}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${SUPERSET_DB_USER:-superset}:${SUPERSET_DB_PASSWORD:?set SUPERSET_DB_PASSWORD}@${POSTGRES_HOST:?set POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${SUPERSET_DB_NAME:-superset}
    ports:
      - "${SUPERSET_PORT:-8088}:8088"

  proxy:
    image: caddy:2-alpine
    container_name: etls_proxy
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", ":80", "--to", "web:8000"]
    ports:
      - "80:80"
    depends_on:
      - web

  # Pipelines dbt (Couche D) — lecture du RÉPLICA uniquement.
  # Usage (one-shot, jamais lancé par `up`) :
  #   docker compose -f docker-compose.prod.yml --env-file .env run --rm dbt run
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.9
    profiles: ["dbt"]
    working_dir: /usr/app
    volumes:
      - ./dbt:/usr/app
      - ./dbt/profiles.yml:/root/.dbt/profiles.yml:ro
    environment:
      DBT_HOST: ${POSTGRES_REPLICA_HOST:?set POSTGRES_REPLICA_HOST}
      DBT_PORT: ${POSTGRES_PORT:-5432}
      DBT_USER: ${POSTGRES_USER:-etls}
      DBT_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DBT_DBNAME: ${POSTGRES_DB:-etls}
      DBT_SCHEMA: ${DBT_SCHEMA:-dbt}
    entrypoint: ["dbt"]
    command: ["build"]

volumes:
  redis_data:
